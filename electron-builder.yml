appId: com.mapper.desktop
productName: mapper
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
npmRebuild: false
extraResources:
  - from: resources/notices
    to: notices
  - from: LICENSE
    to: LICENSE.mapper
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: mapper
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: rpm
      arch: [x64]
  category: Graphics
  executableName: mapper
  maintainer: mapper contributors
  vendor: mapper contributors
  synopsis: Fictional world map management and measurement
publish: null
